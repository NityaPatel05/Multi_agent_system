# Security posture: only the API is reachable from the host, and only on 127.0.0.1 by
# default (set API_BIND=0.0.0.0 AND a strong API_KEY to expose it). Postgres, Qdrant and the
# two tool servers live on the internal compose network with no published ports. Secrets are
# required (no default passwords), and each service receives only the variables it needs.
# To debug a dependency from the host, temporarily add `ports: ["127.0.0.1:PORT:PORT"]`.

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (no default)}
      POSTGRES_DB: research_langgraph
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    <<: *restart
    image: qdrant/qdrant:v1.19.2
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?set QDRANT_API_KEY in .env}
    volumes:
      - qdrant_data:/qdrant/storage

  # Tool services (plain HTTP/REST wrappers around the adapters; not the MCP wire protocol).
  # Both require the shared X-Service-Token. Only the search service gets search keys; the
  # extract service - which handles the most hostile input - gets NO API keys at all.
  mcp-search:
    <<: *restart
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    command: ["uvicorn", "research_langgraph.tools.mcp_search_server:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      TOOL_SERVICE_TOKEN: ${TOOL_SERVICE_TOKEN:?set TOOL_SERVICE_TOKEN in .env}
      EXA_API_KEY: ${EXA_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp-extract:
    <<: *restart
    build:
      context: .
      dockerfile: docker/Dockerfile.mcp
    command: ["uvicorn", "research_langgraph.tools.mcp_extract_server:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      TOOL_SERVICE_TOKEN: ${TOOL_SERVICE_TOKEN:?set TOOL_SERVICE_TOKEN in .env}
      OFFLINE_MODE: ${OFFLINE_MODE:-0}
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    <<: *restart
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_KEY: ${API_KEY:?set API_KEY in .env}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
      DATABASE_URL: postgresql://research:${POSTGRES_PASSWORD}@postgres:5432/research_langgraph
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      MCP_SEARCH_URL: http://mcp-search:8001
      MCP_EXTRACT_URL: http://mcp-extract:8002
      TOOL_SERVICE_TOKEN: ${TOOL_SERVICE_TOKEN}
    ports:
      - "${API_BIND:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      # The api self-heals to in-process adapters if a tool service is down, so it only
      # waits for them to start, not to be healthy.
      mcp-search:
        condition: service_started
      mcp-extract:
        condition: service_started

volumes:
  postgres_data:
  qdrant_data:
